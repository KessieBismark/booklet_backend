[mypy]
python_version = 3.12
# Lenient defaults so the gate is adoptable on day one; tighten over time.
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
exclude = (^|/)(tests|alembic|venv)(/|$)

# Generated code leans on Strawberry/SQLAlchemy descriptors — don't fail on their dynamic attrs.
[mypy-strawberry.*]
ignore_errors = True

[mypy-sqlalchemy.*]
ignore_errors = True
