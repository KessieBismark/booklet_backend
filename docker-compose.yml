name: stack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    networks: [internal]
    # NOTE: no `ports:` — Postgres stays private to the Docker network.

  booklet:
    build: ./booklet_backend
    restart: unless-stopped
    env_file: ./env/booklet.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"] # internal only
    mem_limit: 200m
    networks: [internal]

  app2:
    build: ./app2_backend
    restart: unless-stopped
    env_file: ./env/app2.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"]
    mem_limit: 200m
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
