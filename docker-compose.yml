version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: booklet_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: booklet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booklet_network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: booklet_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booklet_network

  # Application
  app:
    build: .
    container_name: booklet_api
    environment:
      # Database Configuration
      DATABASE_URL: 
      DB_DRIVER: 
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: dev_password_change_in_production
      DB_NAME: booklet_db
      
      # Security
      SECRET_KEY: ${SECRET_KEY}
      PASSWORD_ENCRYPTION_KEY: ${PASSWORD_ENCRYPTION_KEY}
      
      # Application Settings
      APP_NAME: booklet
      ENVIRONMENT: development
      DEBUG: "true"
      AUTH_TYPE: JWT
      CONNECTION_TYPE: Asynchronous
      
      # Redis Configuration
      REDIS_URL: redis://booklet_cache:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - booklet_network

networks:
  booklet_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
