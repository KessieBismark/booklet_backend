[pytest]
# Generated by backend_coder — api_type: Both
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    unit: Pure logic tests — no DB, no HTTP
    integration: Tests that use the test DB and HTTP client
    security: Auth enforcement, token abuse, and ownership tests
    slow: Tests that take longer than 1 second

[coverage:run]
source = .
omit =
    tests/*
    venv/*
    alembic/*
    */__pycache__/*

[coverage:report]
fail_under = 75
show_missing = True
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
